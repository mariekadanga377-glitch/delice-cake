<!DOCTYPE html>
<html>
<head>
<title>Délice Cake</title>

<style>
body{font-family:Arial;background:#fff5f5;margin:0}

header{
background:#d63384;color:white;text-align:center;padding:20px;
}

.container{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:10px;
}

.card{
background:white;border-radius:10px;overflow:hidden;
}

.card img{
width:100%;height:170px;object-fit:cover;
}

.card-content{padding:10px}

.btn{
display:block;background:#25D366;color:white;
text-align:center;padding:10px;text-decoration:none;
}

.filters{text-align:center;padding:10px}

.filters a{
margin:5px;padding:8px 12px;background:white;
text-decoration:none;border-radius:20px;
}
</style>

</head>

<body>

<header>
<h2>🍰 Délice Cake</h2>
<p>Commandez vos gâteaux facilement</p>
</header>

<div class="filters">
<a href="/">Tous</a>
<a href="/?category=Anniversaire">Anniversaire</a>
<a href="/?category=Mariage">Mariage</a>
<a href="/?category=Chocolat">Chocolat</a>
</div>

<div class="container">

{% for p in posts %}

<div class="card">

<a href="/cake/{{ p[0] }}">

<img src="{{ url_for('static', filename='images/' + p[1]) }}">

</a>

<div class="card-content">
<p>{{ p[2] }}</p>
<p>{{ p[4] }} USD</p>
</div>

<a class="btn"
href="https://wa.me/243976241345?text=Je%20veux%20commander%20le%20gâteau%20%23{{ p[0] }}">
Commander
</a>

</div>

{% endfor %}

</div>

</body>
</html>
