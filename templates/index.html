<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Délice Cake 🍰</title>

<style>

body{margin:0;font-family:Arial;background:#f7f7f7}

/* HEADER */
header{
background:linear-gradient(135deg,#d63384,#ff4d6d);
text-align:center;
color:white;
padding:20px;
}

header img{
width:100%;
max-width:300px;
height:120px;
object-fit:contain;
}

/* FILTERS */
.filters{
display:flex;
overflow-x:auto;
gap:8px;
padding:10px;
background:white;
}

.filters a{
padding:8px 12px;
background:#eee;
border-radius:20px;
text-decoration:none;
font-size:13px;
color:#333;
}

/* GRID */
.container{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:10px;
}

/* CARD */
.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.card img{
width:100%;
height:150px;
object-fit:cover;
}

.card-content{padding:10px}

.category{color:#d63384;font-size:12px;font-weight:bold}
.price{font-weight:bold}

.btn{
display:block;
background:#25D366;
color:white;
text-align:center;
padding:10px;
text-decoration:none;
font-weight:bold;
}

/* FLOAT */
.float{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
padding:15px;
border-radius:50px;
color:white;
text-decoration:none;
}

</style>

</head>

<body>

<header>
<img src="{{ url_for('static', filename='images/logo.jpg') }}">
<h2>Délice Cake 🍰</h2>
<p>Le goût du luxe sucré</p>
</header>

<div class="filters">
<a href="/">Tous</a>
<a href="/?category=Anniversaire">Anniversaire</a>
<a href="/?category=Mariage">Mariage</a>
<a href="/?category=Chocolat">Chocolat</a>
<a href="/?category=Sans crème">Sans crème</a>
</div>

<div class="container">

{% for p in posts %}

<div class="card">

<img src="{{ url_for('static', filename='images/' + p[1]) }}">

<div class="card-content">

<div class="category">{{ p[3] }}</div>
<p>{{ p[2] }}</p>
<div class="price">{{ p[4] }} USD</div>

</div>

<a class="btn"
href="https://wa.me/243976241345?text=Commande%20gâteau%20%23{{ p[0] }}">
Commander 📱
</a>

</div>

{% endfor %}

</div>

<a class="float" href="https://wa.me/243976241345">
WhatsApp
</a>

</body>
</html>
