<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Délice Cake 🍰</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f7f7f7;
}

/* HEADER PRO */
header{
background:linear-gradient(135deg,#d63384,#ff4d6d);
color:white;
padding:25px;
text-align:center;
}

header img{
width:80px;
height:80px;
border-radius:50%;
object-fit:cover;
border:3px solid white;
margin-bottom:10px;
}

/* HERO */
.hero{
text-align:center;
padding:20px;
background:white;
}

.hero h2{
margin:5px;
}

/* FILTERS */
.filters{
display:flex;
gap:8px;
overflow-x:auto;
padding:10px;
background:white;
}

.filters a{
flex:0 0 auto;
padding:8px 12px;
background:#eee;
border-radius:20px;
text-decoration:none;
color:#333;
font-size:13px;
}

/* PRODUCTS GRID */
.container{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:10px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 3px 10px rgba(0,0,0,0.08);
transition:0.3s;
}

.card:hover{
transform:scale(1.02);
}

.card img{
width:100%;
height:150px;
object-fit:cover;
}

.card-content{
padding:10px;
}

.category{
font-size:12px;
color:#d63384;
font-weight:bold;
}

.price{
font-weight:bold;
margin-top:5px;
}

.btn{
display:block;
background:#25D366;
color:white;
text-align:center;
padding:10px;
text-decoration:none;
font-weight:bold;
}

footer{
text-align:center;
padding:20px;
background:#222;
color:white;
margin-top:20px;
}

</style>

</head>

<body>

<header>
<img src="{{ url_for('static', filename='images/logo.jpg') }}">
<h1>Délice Cake 🍰</h1>
<p>Le goût du luxe sucré</p>
</header>

<div class="hero">
<h2>Nos gâteaux faits maison 🎂</h2>
<p>Commandez directement sur WhatsApp</p>
</div>

<div class="filters">
<a href="/">Tous</a>
<a href="/?category=Anniversaire">Anniversaire</a>
<a href="/?category=Mariage">Mariage</a>
<a href="/?category=Chocolat">Chocolat</a>
<a href="/?category=Sans crème">Sans crème</a>
</div>

<div class="container">

{% for p in posts %}

<div class="card">

<img src="{{ url_for('static', filename='images/' + p[1]) }}">

<div class="card-content">

<div class="category">{{ p[3] }}</div>

<p>{{ p[2] }}</p>

<div class="price">{{ p[4] }} USD</div>

</div>

<a class="btn"
href="https://wa.me/243976241345?text=Bonjour%20je%20veux%20commander%20le%20gâteau%20%23{{ p[0] }}">
Commander 📱
</a>

</div>

{% endfor %}

</div>

<footer>
Délice Cake — Boutique officielle 🍰
</footer>

</body>
</html>
