<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Délice Cake 🍰</title>

<meta property="og:title" content="Délice Cake 🍰">
<meta property="og:description" content="Gâteaux faits maison 💖">
<meta property="og:image" content="/static/images/logo.jpg">

<style>

body{
    margin:0;
    font-family:Arial;
    background:#fff5f5;
}

header{
    background:#d63384;
    color:white;
    text-align:center;
    padding:20px;
}

header img{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid white;
}

.filters{
    padding:10px;
    text-align:center;
}

.filters a{
    display:inline-block;
    margin:5px;
    padding:8px 12px;
    background:white;
    border-radius:20px;
    text-decoration:none;
    color:#d63384;
    font-size:13px;
    font-weight:bold;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.container{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:10px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.card img{
    width:100%;
    height:160px;
    object-fit:cover;
}

.card-content{
    padding:8px;
}

.category{
    color:#d63384;
    font-size:12px;
    font-weight:bold;
}

.price{
    font-size:15px;
    font-weight:bold;
}

.btn{
    display:block;
    background:#25D366;
    color:white;
    text-align:center;
    padding:10px;
    text-decoration:none;
    font-weight:bold;
}

.empty{
    text-align:center;
    padding:30px;
    color:#777;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:20px;
}

</style>

</head>

<body>

<header>

<img src="/static/images/logo.jpg">

<h1>🍰 Délice Cake</h1>

<p>Gâteaux faits maison 💖</p>

</header>

<div class="filters">

<a href="/">Tous</a>
<a href="/?category=Anniversaire">Anniversaire</a>
<a href="/?category=Mariage">Mariage</a>
<a href="/?category=Chocolat">Chocolat</a>
<a href="/?category=Sans crème">Sans crème</a>
<a href="/?category=Petit déjeuner">Petit déjeuner</a>

</div>

{% if posts %}

<div class="container">

{% for p in posts %}

<div class="card">

<img src="/static/images/{{ p.image }}">

<div class="card-content">

<p class="category">{{ p.category }}</p>

<p>{{ p.desc }}</p>

<p class="price">{{ p.price }} FC</p>

</div>

<a class="btn"
href="https://wa.me/243976241345?text=Bonjour,%20je%20veux%20commander%20ce%20gâteau%20🍰%0A%0ACatégorie:%20{{ p.category }}%0APrix:%20{{ p.price }}%20FC"
target="_blank">

Commander 📱

</a>

</div>

{% endfor %}

</div>

{% else %}

<div class="empty">

<h3>Aucun gâteau disponible 🍰</h3>

</div>

{% endif %}

<footer>

<p>📱 WhatsApp Délice Cake</p>

<p>Fait avec 💖</p>

</footer>

</body>
</html>
